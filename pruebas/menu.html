    <script>
        const btn = document.querySelector('#morph-btn');
let isMenuOpen = false;

// KUTE.js pre-calcula la transformación (De Hamburguesa -> Logo)
const morphToLogo = KUTE.fromTo(
  '#hamburguesa', 
  { path: '#hamburguesa' }, 
  { path: '#logo' }, 
  { 
    duration: 600, // Duración en milisegundos (0.6s)
    easing: 'easingCubicInOut' // Movimiento suave
  }
);

// KUTE.js pre-calcula el camino inverso (De Logo -> Hamburguesa)
const morphToHamburger = KUTE.fromTo(
  '#hamburguesa', 
  { path: '#logo' }, 
  { path: '#hamburguesa' }, 
  { 
    duration: 600,
    easing: 'easingCubicInOut'
  }
);

btn.addEventListener('click', () => {
  if (!isMenuOpen) {
    // Si está cerrado, transformamos en logo
    morphToLogo.start();
  } else {
    // Si está abierto, volvemos a la hamburguesa
    morphToHamburger.start();
  }
  
  // Cambiamos el estado
  isMenuOpen = !isMenuOpen;
});
    </script>
